<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Internshala Company Blocker</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Blocked companies</h1>
      <p class="hint">Listings from these companies are hidden on Internshala.</p>
      <form id="add-company-form">
        <label class="sr-only" for="company-name">Company name</label>
        <input id="company-name" type="text" autocomplete="off" placeholder="Company name" required maxlength="120">
        <button type="submit">Add</button>
      </form>
      <p id="message" class="message" aria-live="polite"></p>
      <ul id="company-list" aria-label="Blocked companies"></ul>
      <p id="empty-state" class="empty-state">No companies blocked yet.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
